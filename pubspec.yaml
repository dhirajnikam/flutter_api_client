name: flutter_api_client
description: "Type-safe HTTP client for Flutter/Dart with retries, cache, dedup, refresh-queue auth, cancel tokens, and a spec-driven mock + docs + backend-guide generator."
version: 1.4.0
homepage: https://github.com/dhirajnikam/flutter_api_client
repository: https://github.com/dhirajnikam/flutter_api_client
issue_tracker: https://github.com/dhirajnikam/flutter_api_client/issues

topics:
  - http
  - api-client
  - networking
  - mock
  - openapi

environment:
  sdk: ^3.0.0

executables:
  gen: gen

dependencies:
  http: ^1.6.0
  collection: ^1.19.1
  build: ^4.0.6
  source_gen: ^4.2.3
  args: ^2.7.0
  hive: ^2.2.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
