name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # NOTE: pinned to major tags; switch to commit SHAs if policy requires it.
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # Fails on an import cycle between files under lib/.
      - run: dart run lakos -o /dev/null lib
      # The builder path: regenerate the example and require no diff.
      - working-directory: example
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
          flutter test
